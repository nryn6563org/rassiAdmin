name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # main 브랜치에 푸시될 때마다 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v4
    
    # Node 18 설정 및 호환성 옵션 적용
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18' 

    - name: Install dependencies 
      run: npm install

    # Nuxt generate 실행 (레거시 공급자 옵션 적용)
    - name: Generate Static Site
      run: NODE_OPTIONS=--openssl-legacy-provider npm run generate

    # GitHub Pages에 배포
    - name: Deploy 🚀
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist # 배포할 폴더 지정 (npm run generate의 결과 폴더)
        publish_branch: gh-pages # 배포할 브랜치 지정
